<main class="auth-card">
  <h2>{{ isRegistering ? 'Create your account' : 'Sign in to FraudProof' }}</h2>
  <p>Reservations and checkout require an account.</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password">
    <small *ngIf="isRegistering">Use at least 12 characters.</small>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <button class="submit-button" type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Please wait…' : (isRegistering ? 'Create account' : 'Sign in') }}
    </button>
  </form>
  <button class="link-button" type="button" (click)="isRegistering = !isRegistering; errorMessage = null">
    {{ isRegistering ? 'Already have an account? Sign in' : 'New here? Create an account' }}
  </button>
</main>
