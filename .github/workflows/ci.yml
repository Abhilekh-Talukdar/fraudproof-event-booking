name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  postgres-concurrency:
    name: PostgreSQL concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraudproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraudproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FRAUDPROOF_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fraudproof_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run PostgreSQL concurrency tests
        working-directory: backend
        run: python -m pytest tests/test_postgres_concurrency.py -v

  frontend-build:
    name: Angular production build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate npm lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit updated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'security/refresh-vulnerable-npm-deps'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): resolve remaining npm audit findings"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Check all npm dependency advisories
        run: npm audit

      - name: Build frontend
        run: npm run build
