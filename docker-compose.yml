services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudproof
      POSTGRES_USER: fraudproof
      POSTGRES_PASSWORD: fraudproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudproof -d fraudproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
